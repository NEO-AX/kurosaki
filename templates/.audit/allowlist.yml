# 検出の除外（allowlist）
#
# ここに書いたものは検出から外れる。したがってこのファイルは**監査の抜け道になりうる**。
# 次の規律を機械が強制している（D7-02 / allowlist.py）:
#
#   - `reason` と `approved_by` が無い項目は無効（除外されない）
#   - 書式を解釈できない場合、除外を**一切**適用しない（fail closed）
#   - `expires` を過ぎた項目は無効
#   - パスが広すぎる（`*` など）／全ルール除外／指紋指定なし は所見になる
#   - このファイルの変更が人間以外の名義だった場合も所見になる
#
# 値そのものは書かない。`kurosaki scan --format json` が出す fingerprint で指す。

version: 1

# Faker(ja_JP) で生成したダミーだけを許すパス。
# Faker が導入されていない環境では照合できないため、この緩和は適用されない。
faker_ja_jp_paths: []

allow: []
